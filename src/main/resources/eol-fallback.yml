# Embedded EOL fallback dataset — used when the endoflife.date API is unavailable.
#
# Data is sourced from https://endoflife.date and should be refreshed periodically.
# Last updated: 2026-09-22
#
# Format:
#   product:   the endoflife.date product slug (matches eol-mappings.yml)
#   cycle:     major.minor version string (e.g. "2.7")
#   eol:       ISO-8601 date on which the cycle became/becomes EOL, or null if still supported
#
# Status derivation follows the same rules as the live API:
#   - null eol date   → SUPPORTED
#   - eol date ≤ today → EOL
#   - eol date > today → MAINTENANCE

cycles:
