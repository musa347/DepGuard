spring:
  application:
    name: depguard

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/depguard}
    username: ${DB_USERNAME:depguard}
    password: ${DB_PASSWORD:depguard}
    hikari:
      auto-commit: false

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 15
        order_inserts: true
        order_updates: true
        connection.provider_disables_autocommit: true
        query.fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      completion-mode: update
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    git:
      mode: full

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.depguard: INFO

depguard:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
