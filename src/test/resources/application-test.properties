# Test profile — used by all integration tests via @ActiveProfiles("test")
spring.jpa.show-sql=true
spring.flyway.enabled=true

# Disable docker-compose during tests (Testcontainers handles the DB)
spring.docker.compose.enabled=false

# Keep context cacheable: no per-test overrides here
logging.level.io.depguard=DEBUG
logging.level.org.springframework.test.context.cache=DEBUG
